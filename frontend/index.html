<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Vasconcellos Automotriz — Control de Inventario</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body class="tema-azul">

<div class="wrapper">
  <!--====================
      UNIFIED SIDEBAR
  =====================-->
  <aside class="sb" id="sidebar">
      <div class="sidebar-header">
          <div class="logo-container">
              <div class="logo-icon-solid">
                  <i class="fa-solid fa-car-side"></i>
              </div>
              <span class="logo-text">Vasconcellos</span>
          </div>
          <button id="toggle" class="toggle-btn" title="Alternar menú">
              <i class="fa-solid fa-bars"></i>
          </button>
      </div>

      <div class="slbl">Módulos principales</div>
      <div class="nav-list">
          <button id="menu-inventario" class="ni act" onclick="clickInventario()">
              <i class="fa-solid fa-boxes-stacked"></i>
              <span>Inventario</span>
              <i class="fa-solid fa-angle-right arrow-indicator" id="arrow-inv"></i>
          </button>
          
          <div class="submenu" id="submenu-inventario"></div>

          <button id="menu-ventas" class="ni" onclick="mostrarVentas()">
              <i class="fa-solid fa-cart-shopping"></i>
              <span>Ventas</span>
          </button>

          <button id="menu-compras" class="ni" onclick="mostrarCompras()">
              <i class="fa-solid fa-bag-shopping"></i>
              <span>Compras</span>
          </button>

          <button id="menu-lavados" class="ni" onclick="mostrarLavados()">
              <i class="fa-solid fa-shower"></i>
              <span>Lavados / Servicios</span>
          </button>
      </div>

      <div class="slbl" style="margin-top: auto;">Sistema</div>
      <div class="nav-list" style="margin-bottom: 24px;">
          <button id="menu-movimientos" class="ni" onclick="mostrarMovimientos()">
              <i class="fa-solid fa-right-left"></i>
              <span>Movimientos</span>
          </button>

          <button id="menu-ajustes" class="ni" onclick="mostrarAjustes()">
              <i class="fa-solid fa-gear"></i>
              <span>Ajustes</span>
          </button>
      </div>
  </aside>

  <!-- ============================================================
       CONTENIDO PRINCIPAL
  ============================================================ -->
  <main class="main">

    <!-- ============================================================
         DASHBOARD (INVENTARIO COMPLETO)
    ============================================================ -->
    <section id="dashboard" class="content">

      <h2>Inventario</h2>

      <!-- Buscador + botón agregar -->
      <div class="fila-buscador">
        <input
          type="text"
          id="buscador"
          placeholder="Buscar producto..."
          onkeyup="buscarProducto()"
        />

        <button class="btn-agregar" onclick="abrirAgregarProducto()">
          ➕ Agregar Producto
        </button>
      </div>

      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Producto</th>
              <th>Categoría</th>
              <th>Stock</th>
              <th>Precio</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaProductos"></tbody>
        </table>
      </div>
    </section>

    <!-- ============================================================
         VENTAS
    ============================================================ -->
    <section id="ventas" class="content">

      <h2>Ventas</h2>

      <div class="form-grid">
        <div>
          <label>Categoría</label>
          <select id="ventaCategoria" onchange="filtrarProductosVenta()"></select>
        </div>

        <div>
          <label>Producto</label>
          <select id="ventaProducto" onchange="actualizarPrecioYTotal()"></select>
        </div>

        <div>
          <label>Cantidad</label>
          <input type="number" id="ventaCantidad" value="1" oninput="actualizarPrecioYTotal()" />
        </div>

        <div>
          <label>Precio</label>
          <input type="text" id="ventaPrecio" disabled />
        </div>

        <div>
          <label>Total</label>
          <input type="text" id="ventaTotal" disabled />
        </div>

        <button class="btn-primary" onclick="registrarVenta()">Registrar Venta</button>
      </div>

      <div id="ventasMeses"></div>
    </section>

    <!-- ============================================================
         COMPRAS
    ============================================================ -->
    <section id="compras" class="content">

      <h2>Compras</h2>

      <div class="form-grid">
        <div>
          <label>Categoría</label>
          <select id="compraCategoria" onchange="filtrarProductosCompra()"></select>
        </div>

        <div>
          <label>Producto</label>
          <select id="compraProducto" onchange="actualizarTotalCompra()"></select>
        </div>

        <div>
          <label>Cantidad</label>
          <input type="number" id="compraCantidad" value="1" oninput="actualizarTotalCompra()" />
        </div>

        <div>
          <label>Precio compra</label>
          <input type="number" id="compraPrecio" value="0" oninput="actualizarTotalCompra()" />
        </div>

        <div>
          <label>Total</label>
          <input type="text" id="compraTotal" disabled />
        </div>

        <button class="btn-primary" onclick="registrarCompra()">Registrar Compra</button>
      </div>

      <div id="comprasMeses"></div>
    </section>

    <!-- ============================================================
         LAVADOS / SERVICIOS
    ============================================================ -->
    <section id="lavados" class="content">

      <h2>Lavados / Servicios</h2>

      <div class="form-grid">
        <div>
          <label>Tipo de servicio</label>
          <input type="text" id="lavadoTipo" placeholder="Ej: Lavado full" />
        </div>

        <div>
          <label>Detalles</label>
          <input type="text" id="lavadoDetalles" />
        </div>

        <div>
          <label>Precio</label>
          <input type="number" id="lavadoPrecio" value="0" />
        </div>

        <button class="btn-primary" onclick="registrarLavado()">Registrar Servicio</button>
      </div>

      <h3>Servicios de hoy</h3>
      <div id="lavadosHoy"></div>
    </section>

    <!-- ============================================================
         MOVIMIENTOS
    ============================================================ -->
    <section id="movimientos" class="content">
      <h2>Movimientos</h2>
      <div id="tablaMovimientos"></div>
    </section>

    <!-- ============================================================
         AJUSTES
    ============================================================ -->
    <section id="ajustes" class="content">
      <h2>Ajustes</h2>

      <label for="temaSelect">Tema visual</label>
      <select id="temaSelect" onchange="cambiarTema()">
        <option value="azul">Azul</option>
        <option value="verde">Verde</option>
        <option value="rojo">Rojo</option>
        <option value="morado">Morado</option>
      </select>

      <button class="btn-primary" onclick="restaurarTema()">Restaurar tema</button>
    </section>

  </main>
</div>

  <script src="js/script.js"></script>
</body>
</html>
